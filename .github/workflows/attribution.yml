name: Attribution sync

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Lightpanda license
        run: |
          curl -fsSL https://raw.githubusercontent.com/lightpanda-io/browser/main/LICENSE -o ATTRIBUTION_LIGHTPANDA.md
          echo "# Attribution" > ATTRIBUTION.md
          echo "" >> ATTRIBUTION.md
          echo "## Lightpanda" >> ATTRIBUTION.md
          echo "Source: https://github.com/lightpanda-io/browser" >> ATTRIBUTION.md
          cat ATTRIBUTION_LIGHTPANDA.md >> ATTRIBUTION.md
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ATTRIBUTION.md
          git commit -m "chore: sync attribution" || echo "no changes"
          git push || true