name: Check package updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned vs upstream versions
        id: check
        run: |
          PINNED=$(grep -oP 'releases/download/\K[0-9.]+' melange.yaml | head -1)
          LATEST=$(curl -s https://api.github.com/repos/lightpanda-io/browser/releases/latest | jq -r .tag_name)
          echo "pinned=$PINNED latest=$LATEST"
          echo "pinned=$PINNED" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          [ "$PINNED" = "$LATEST" ] || echo "outdated=true" >> $GITHUB_OUTPUT
      - name: Open issue if Lightpanda is outdated
        if: steps.check.outputs.outdated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: Lightpanda ${process.env.LATEST} available (pinned ${process.env.PINNED})`,
              body: `Update the pinned URL in melange.yaml and rebuild.`,
              labels: ['dependencies']
            })
        env:
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}